<!DOCTYPE html>
<html>
<head>
    <title>Application Form</title>
</head>

<body>

    <h1 align="center ">APPLICATION FORM</h1>

    <form>

        <!-- General Information -->

        <div style="border: 2px solid black;">

              <h2 style="color: darkblue;">General Information</h2>

              <label>Full Name:</label>
              <input type="text">

            <br><br>

            <label>Birth Date:</label>
            <input type="date">

            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female

            <br><br>

            <label>Address:</label>
            <input type="text">

            <br><br>

            <label>Phone Number:</label>
            <input type="text">

            <br><br>

            <label>Email Address:</label>
            <input type="text">

            <br><br>

            <label>CNIC / ID Number:</label>
            <input type="text">

            <br><br>

            <label>Marital Status:</label>
            <select>
                <option>Single</option>
                <option>Married</option>
                <option>Divorced</option>
            </select>

            <br><br>

            <label>Occupation:</label>
            <input type="text">

        </div>

        <br>


        <!-- Health Coverage -->

        <div style="border: 2px solid black;">

            <h2 style="color: darkblue;">Type of Health Coverage</h2>

            <label>Employee Coverage:</label>
            <input type="checkbox"> Yes

            <br><br>

            <label>Employee Plan Choice:</label>
            <select>
                <option>Select Plan</option>
                <option>Plan A</option>
                <option>Plan B</option>
            </select>

            <br><br>

            <label>Spouse Coverage:</label>
            <input type="checkbox"> Yes

            <br><br>

            <label>Spouse Plan Choice:</label>
            <select>
                <option>Select Plan</option>
                <option>Plan A</option>
                <option>Plan B</option>
            </select>

            <br><br>

            <label>Children Coverage:</label>
            <input type="checkbox"> Yes

            <br><br>

            <label>Children Plan Choice:</label>
            <select>
                <option>Select Plan</option>
                <option>Plan A</option>
                <option>Plan B</option>
            </select>

        </div>

        <br>


        <!-- Spouse / Children Information -->

        <div style="border: 2px solid black;">

            <h2 style="color: darkblue;">Spouse / Children Information</h2>

            <label>Dependent Name:</label>
            <input type="text">

            <br><br>

            <label>ID / SSN:</label>
            <input type="text">

            <br><br>

            <label>Relationship:</label>
            <input type="text">

            <br><br>

            <label>Birth Date:</label>
            <input type="date">

            <br><br>

            <label>Age:</label>
            <input type="text">

            <br><br>

            <label>Gender:</label>
            <input type="radio" name="dependent"> Male
            <input type="radio" name="dependent"> Female

        </div>

        <br>


        <!-- Billing Information -->

        <div style="border: 2px solid black;">

            <h2 style="color: darkblue;">Billing Information</h2>

            <label>Units:</label>
            <input type="text">

            <br><br>

            <label>Annual Premium:</label>
            <input type="text">

            <br><br>

            <label>Payment Mode:</label>
            <select>
                <option>Monthly</option>
                <option>Quarterly</option>
                <option>Yearly</option>
            </select>

            <br><br>

            <label>Cash With Application:</label>
            <input type="text">

            <br><br>

            <label>Planned Monthly Premium:</label>
            <input type="text">

        </div>

        <br>


        <!-- Required Documents -->

        <div style="border: 2px solid black;">

            <h2 style="color: darkblue;">Required Documents</h2>

            <label>Upload Document:</label>
            <input type="file">

        </div>

        <br>


        <!-- Declaration -->

        <div style="border: 2px solid black;">

            <h2 style="color: darkblue;">Declaration</h2>

            <input type="checkbox">

            <label>
                I declare that the information provided in this application
                is true and complete.
            </label>

            <br><br>

            <label>Applicant Full Name:</label>
            <input type="text">

            <br><br>

            <label>Signature:</label>
            <input type="text">

            <br><br>

            <label>Application Date:</label>
            <input type="date">

        </div>

        <br><br>


        <!-- Buttons -->

        <input type="reset" value="Clear Form">

        <input type="submit" value="Submit Application">

    </form>

</body>
</html>
